<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title id="pageTitle">Sfingin izazov</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sand" aria-hidden="true"></div>

  <header>
    <h1 id="appTitle">𓂀 Sfingin izazov</h1>
    <p id="subtitle">Riješi zagonetku i otkrij tajnu ulaza</p>
  </header>

  <section id="languageBox" aria-label="Language selection">
    <h2 id="languageBoxTitle">Odaberi jezik</h2>
    <button id="btnHR" onclick="startGame('hr')">🇭🇷 Hrvatski</button>
    <button id="btnEN" onclick="startGame('en')">🇬🇧 English</button>
  </section>

  <main id="game" class="hidden" aria-live="polite">
    <div class="sphinx" aria-hidden="false">
      <picture>
        <source srcset="images/sphinx.svg" type="image/svg+xml" />
        <img id="sphinxImg" src="images/sphinx.png" alt="Sfinga" />
      </picture>
    </div>

    <div class="visitor" aria-label="Visitor counter">
      👤 <span id="visitorCount">0</span>
      <p id="visitorLabel">posjetitelja danas</p>
    </div>

    <div class="riddleBox" role="region" aria-labelledby="dayTitle">
      <h2 id="dayTitle">Današnja zagonetka</h2>
      <p id="riddle" aria-live="polite"></p>

      <label for="answer" class="sr-only">Odgovor</label>
      <input id="answer" type="text" placeholder="Upiši odgovor" aria-label="Odgovor na zagonetku" />
      <div style="margin-top:0.5em;">
        <button id="checkBtn" onclick="checkAnswer()" class="check">Provjeri odgovor</button>
        <!-- initially hidden; will appear after first attempt -->
        <button id="showAnswerBtn" class="small" onclick="confirmShowAnswer()" aria-controls="result" aria-expanded="false" style="display:none;">Prikaži odgovor</button>
      </div>

      <div id="result" aria-live="polite" style="margin-top:0.8em;"></div>
    </div>
  </main>

  <footer>
    <p id="footerText">𓆣  Samo mudri prolaze pokraj Sfinge 𓆣</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
