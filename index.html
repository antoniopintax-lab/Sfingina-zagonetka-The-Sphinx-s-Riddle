<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sfingin izazov</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sand"></div>
<header>
    <h1>𓂀 Sfingin izazov</h1>
    <p id="subtitle">Riješi zagonetku i otkrij tajnu ulaza</p>
</header>

<section id="languageBox">
    <h2>Odaberi jezik</h2>
    <button onclick="startGame('hr')">🇭🇷 Hrvatski</button>
    <button onclick="startGame('en')">🇬🇧 English</button>
</section>

<main id="game" class="hidden">
    <div class="sphinx">
        <img src="images/sphinx.svg" alt="Sfinga">
    </div>

    <div class="visitor">
        👤 <span id="visitorCount">0</span>
        <p>posjetitelja danas</p>
    </div>

    <div class="riddleBox">
        <h2 id="dayTitle">Današnja zagonetka</h2>
        <p id="riddle"></p>

        <input id="answer" type="text" placeholder="Upiši odgovor" aria-label="Odgovor na zagonetku">
        <button onclick="checkAnswer()" class="check">Provjeri odgovor</button>

        <div id="result" aria-live="polite"></div>
    </div>
</main>

<footer>
<p>𓆣  Samo mudri prolaze pokraj Sfinge 𓆣</p>
</footer>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
